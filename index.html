<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Insurance Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Health Insurance Application</h1>
        <form id="insuranceForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" required>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob" required>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="ssn">Social Security Number *</label>
                <input type="text" id="ssn" name="ssn" placeholder="XXX-XX-XXXX" required>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="address">Street Address *</label>
                <input type="text" id="address" name="address" required>
                <span class="error-message"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" name="city" required>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="state">State *</label>
                    <select id="state" name="state" required>
                        <option value="">Select State</option>
                        <option value="AL">Alabama</option>
                        <option value="AK">Alaska</option>
                        <option value="AZ">Arizona</option>
                        <option value="AR">Arkansas</option>
                        <option value="CA">California</option>
                        <option value="CO">Colorado</option>
                        <option value="CT">Connecticut</option>
                        <option value="DE">Delaware</option>
                        <option value="FL">Florida</option>
                        <option value="GA">Georgia</option>
                        <option value="HI">Hawaii</option>
                        <option value="ID">Idaho</option>
                        <option value="IL">Illinois</option>
                        <option value="IN">Indiana</option>
                        <option value="IA">Iowa</option>
                        <option value="KS">Kansas</option>
                        <option value="KY">Kentucky</option>
                        <option value="LA">Louisiana</option>
                        <option value="ME">Maine</option>
                        <option value="MD">Maryland</option>
                        <option value="MA">Massachusetts</option>
                        <option value="MI">Michigan</option>
                        <option value="MN">Minnesota</option>
                        <option value="MS">Mississippi</option>
                        <option value="MO">Missouri</option>
                        <option value="MT">Montana</option>
                        <option value="NE">Nebraska</option>
                        <option value="NV">Nevada</option>
                        <option value="NH">New Hampshire</option>
                        <option value="NJ">New Jersey</option>
                        <option value="NM">New Mexico</option>
                        <option value="NY">New York</option>
                        <option value="NC">North Carolina</option>
                        <option value="ND">North Dakota</option>
                        <option value="OH">Ohio</option>
                        <option value="OK">Oklahoma</option>
                        <option value="OR">Oregon</option>
                        <option value="PA">Pennsylvania</option>
                        <option value="RI">Rhode Island</option>
                        <option value="SC">South Carolina</option>
                        <option value="SD">South Dakota</option>
                        <option value="TN">Tennessee</option>
                        <option value="TX">Texas</option>
                        <option value="UT">Utah</option>
                        <option value="VT">Vermont</option>
                        <option value="VA">Virginia</option>
                        <option value="WA">Washington</option>
                        <option value="WV">West Virginia</option>
                        <option value="WI">Wisconsin</option>
                        <option value="WY">Wyoming</option>
                    </select>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="zip">ZIP Code *</label>
                    <input type="text" id="zip" name="zip" required>
                    <span class="error-message"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="coverage">Coverage Type *</label>
                <select id="coverage" name="coverage" required>
                    <option value="">Select Coverage</option>
                    <option value="individual">Individual</option>
                    <option value="family">Family</option>
                    <option value="spouse">Individual + Spouse</option>
                    <option value="children">Individual + Children</option>
                </select>
                <span class="error-message"></span>
            </div>

            <div class="form-group">
                <label>Do you have any pre-existing conditions? *</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="preexisting" value="yes" required>
                        Yes
                    </label>
                    <label>
                        <input type="radio" name="preexisting" value="no" required>
                        No
                    </label>
                </div>
                <span class="error-message"></span>
            </div>

            <div class="health-section">
                <h2>Health Information</h2>
                <p class="section-description">Please provide accurate health information. This helps us determine appropriate coverage and pricing.</p>

                <div class="form-row">
                    <div class="form-group">
                        <label for="height">Height (inches) *</label>
                        <input type="number" id="height" name="height" min="36" max="96" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="weight">Weight (lbs) *</label>
                        <input type="number" id="weight" name="weight" min="50" max="500" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="smoking">Smoking Status *</label>
                        <select id="smoking" name="smoking" required>
                            <option value="">Select Status</option>
                            <option value="never">Never Smoked</option>
                            <option value="former">Former Smoker (quit 1+ years ago)</option>
                            <option value="current">Current Smoker</option>
                        </select>
                        <span class="error-message"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Existing Health Conditions (check all that apply)</label>
                    <div class="checkbox-grid">
                        <label>
                            <input type="checkbox" name="conditions" value="diabetes">
                            Diabetes
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="heart_disease">
                            Heart Disease
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="high_blood_pressure">
                            High Blood Pressure
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="asthma">
                            Asthma
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="cancer">
                            Cancer (current or history)
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="stroke">
                            Stroke (history)
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="kidney_disease">
                            Kidney Disease
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="copd">
                            COPD
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="mental_health">
                            Mental Health Conditions
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="arthritis">
                            Arthritis
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="sleep_apnea">
                            Sleep Apnea
                        </label>
                        <label>
                            <input type="checkbox" name="conditions" value="none">
                            None of the Above
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="medications">Current Medications</label>
                    <textarea id="medications" name="medications" rows="3" placeholder="List any medications you currently take (optional)"></textarea>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="surgeries">Past Surgeries or Hospitalizations</label>
                    <textarea id="surgeries" name="surgeries" rows="3" placeholder="List any major surgeries or hospitalizations in the past 5 years (optional)"></textarea>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="familyHistory">Family Medical History</label>
                    <textarea id="familyHistory" name="familyHistory" rows="3" placeholder="List any significant family medical history (heart disease, cancer, diabetes, etc.) - optional"></textarea>
                    <span class="error-message"></span>
                </div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="terms" name="terms" required>
                    I agree to the terms and conditions *
                </label>
                <span class="error-message"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Submit Application</button>
                <button type="reset" class="btn-reset">Reset Form</button>
            </div>
        </form>

        <div id="successMessage" class="success-message" style="display: none;">
            <h2>Application Submitted Successfully!</h2>
            <p>Thank you for your health insurance application. We will review your information and contact you shortly.</p>
        </div>
    </div>

    <script src="validation.js"></script>
</body>
</html>
